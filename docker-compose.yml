networks:
  laravel-network:
    name: laravel-network
    driver: bridge

services:
  laravel-laravel:
    platform: 'linux/amd64'
    container_name: laravel-php
    build:
      context: ./docker/laravel-php
      dockerfile: Dockerfile
      args:
        WWWGROUP: 1000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_EXTERNAL_LISTEN_PORT}:80'
    environment:
      TZ: Europe/Warsaw
      WWWUSER: 1000
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    volumes:
      - '.:/var/www/html'
    networks:
      - laravel-network
    depends_on:
      - laravel-mysql

  laravel-mysql:
    platform: 'linux/amd64'
    container_name: laravel-mysql
    image: 'mysql:8'
    env_file: .env
    ports:
      - '${MYSQL_EXTERNAL_LISTEN_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      TZ: Europe/Warsaw
    cap_add:
      - SYS_NICE
    volumes:
      - ./docker/laravel-mysql/:/docker-entrypoint-initdb.d
      - '${DOCKER_MYSQL_VOLUME}:/var/lib/mysql'
    networks:
      - laravel-network
    command: [ "--innodb_redo_log_capacity=1G" ]

  laravel-redis:
    platform: 'linux/amd64'
    environment:
      TZ: Europe/Warsaw
    container_name: laravel-redis
    image: 'redis:latest'
    volumes:
      - 'laravel-redis:/data'
    networks:
      - laravel-network

volumes:
  laravel-mysql:
    name: laravel-mysql
    driver: local
  laravel-redis:
    name: laravel-redis
    driver: local
